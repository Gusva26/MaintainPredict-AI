name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag
        id: tag
        run: echo "value=${GITHUB_REF_NAME//\//-}" >> $GITHUB_OUTPUT

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/maintainpredict-web:${{ steps.tag.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/maintainpredict-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push ml
        uses: docker/build-push-action@v6
        with:
          context: ./apps/ml-service
          file: apps/ml-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/maintainpredict-ml:${{ steps.tag.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/maintainpredict-ml:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────
